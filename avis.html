<script>

if(menu.style.display==="block"){

}

}





const avis = [

{

},

}

];




function changerAvis(){


let nombre = Math.floor(Math.random() * avis.length);


document.getElementById("nomClient").innerHTML = avis[nombre].nom;

document.getElementById("texteAvis").innerHTML = avis[nombre].texte;


}
