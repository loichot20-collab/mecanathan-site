<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MECANATHAN - Mécanique automobile à domicile</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}
body{
    background:#0b0b0b;
    color:white;
}
header{
    position:relative;
    background:
    linear-gradient(rgba(0,0,0,0.70),rgba(0,0,0,0.85)),
    url("garage.jpg");
    background-size:cover;
    background-position:center;
    min-height:90vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}
.logo{
    width:220px;
    max-width:80%;
    margin-bottom:25px;
}
h1{
    font-size:35px;
    color:white;
}
h1 span{
    color:#e30613;
}
.slogan{
    margin:20px 0;
    font-size:20px;
}
.buttons a{
    display:block;
    width:260px;
    margin:12px auto;
    padding:15px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}
.red{
    background:#e30613;
    color:white;
}
.red:hover{
    opacity:0.9;
}

.red:active{
    transform:scale(0.98);
}
.black{
    border:2px solid #e30613;
    color:white;
}
footer{
    text-align:center;
    padding:20px;
    background:#000;
    color:#aaa;
}
.menu{
    position:fixed;
    top:20px;
    right:20px;
    z-index:9999;
}

.menu button{
    background:#e30613;
    color:white;
    border:none;
    font-size:30px;
    padding:8px 12px;
    border-radius:8px;
}

#menuMobile{
    display:none;
    position:absolute;
    right:0;
    top:55px;
    background:#161616;
    padding:15px;
    border-radius:10px;
    width:200px;
}

#menuMobile a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px;
    border-bottom:1px solid #333;
}

#menuMobile a:hover{
    color:#e30613;
}
</style>
</head>

<body>
<header>

<div class="menu">

<button onclick="ouvrirMenu()">☰</button>

<nav id="menuMobile">

<a href="index.html">🏠 Accueil</a>
<a href="prestations.html">🔧 Prestations</a>
<a href="realisations.html">📸 Réalisations</a>
<a href="avis.html">⭐ Avis clients</a>
<a href="apropos.html">👨‍🔧 À propos</a>
<a href="contact.html">📞 Contact</a>

</nav>

</div>

<img src="logo.PNG" alt="Logo MecaNathan" class="logo">
<h1>Mécanique <span>automobile</span> à domicile</h1>
<p class="slogan">
Fleurance, Agen et alentours
</p>
<div class="buttons">
<a class="red" href="tel:+33651048069">
📞 Appeler maintenant
</a>
<a class="red" href="avis.html">
⭐ Avis clients
</a>
<a class="black" href="rendezvous.html">
📅 Prendre rendez-vous
</a>
</div>
</header>
<footer>
    <p>© 2026 MecaNathan - Tous droits réservés</p>
    <a href="mentions-legales.html">Mentions légales</a>
    <a href="politique-confidentialite.html">Politique de confidentialité</a>
</footer>
<script>
function ouvrirMenu(){
    let menu = document.getElementById("menuMobile");
    if(menu.style.display === "block"){
        menu.style.display = "none";
    }else{
        menu.style.display = "block";
    }
}
</script>
</body>
</html>
